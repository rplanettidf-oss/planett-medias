name: Build video and deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Assemble and verify the video
        run: |
          set -euo pipefail
          if [ ! -f ca-te-lustrera-ep1-propre.mp4 ]; then
            cat parts/part_* > /tmp/video.b64
            base64 -d /tmp/video.b64 > ca-te-lustrera-ep1-propre.mp4
          fi
          echo "3c99205390b7dbfc87c0b85612593b17  ca-te-lustrera-ep1-propre.mp4" | md5sum -c
          ls -la ca-te-lustrera-ep1-propre.mp4

      - name: Commit the mp4 if missing from the repo
        run: |
          set -euo pipefail
          if git ls-files --error-unmatch ca-te-lustrera-ep1-propre.mp4 >/dev/null 2>&1; then
            echo "mp4 already tracked"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ca-te-lustrera-ep1-propre.mp4
          git commit -m "Add decoded episode video for Pages and raw URL"
          git push

      - uses: actions/configure-pages@v5

      - name: Stage Pages files
        run: |
          mkdir -p _site
          cp ca-te-lustrera-ep1-propre.mp4 _site/
          touch _site/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
